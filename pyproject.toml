[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-quantum-scheduling"
version = "0.1.0"
description = "Simulation Quantum Scheduling Platform with Multi-Programming and Circuit Cutting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Quantum Scheduling Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.10.8",
    "mqt.bench>=2.1.0",
    "numpy>=2.4.1",
    "pyyaml>=6.0.2",
    "qiskit>=2.3.0,<3",
    "qiskit-addon-cutting>=0.10.0,<0.11",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.45.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["source*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:qiskit.*",
    "ignore::DeprecationWarning:qiskit_aer.*",
    "ignore::DeprecationWarning:qiskit_ibm_runtime.*",
]
