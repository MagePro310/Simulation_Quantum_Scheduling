[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-quantum-scheduling"
version = "0.1.0"
description = "Simulation Quantum Scheduling Platform with Multi-Programming and Circuit Cutting"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Quantum Scheduling Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.8.0",
    "mqt.bench>=2.1.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "qiskit>=1.3.0",
    "qiskit-addon-cutting>=0.9.0",
    "qiskit-aer>=0.15.0",
    "qiskit-ibm-runtime>=0.30.0",
    "scipy>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["source*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:qiskit.*",
    "ignore::DeprecationWarning:qiskit_aer.*",
    "ignore::DeprecationWarning:qiskit_ibm_runtime.*",
]
